</div>

</div>

        Regístrate gratis
        <span class="material-symbols-outlined text-[16px]">north_east</span>
</a>
</p>
</div>
</div>
<script>
  // Interactive password toggle
  const toggleBtn = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('password-field');
  const passwordIcon = document.getElementById('password-icon');

  if (toggleBtn && passwordInput && passwordIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      passwordIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  // Biometric feedback micro-interaction
  const biometricBtn = document.getElementById('biometric-login');
  if (biometricBtn) {
    biometricBtn.addEventListener('click', () => {
      biometricBtn.classList.add('animate-pulse');
      setTimeout(() => {
        biometricBtn.classList.remove('animate-pulse');
      }, 700);
    });
  }
</script></main>
