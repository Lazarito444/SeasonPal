</div>
<div class="flex items-center gap-1.5">

</div>

</div>
<!-- Culinary Level Picker -->
<div class="flex flex-col gap-2 pt-space-xs">
<div class="flex items-center justify-between">


</div>

</div>

<div class="flex flex-col gap-space-sm pt-space-xs">
<!-- Newsletter Opt-in -->

<!-- Terms & Conditions Opt-in -->

<div class="relative flex items-center justify-center mt-0.5">

<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
<div class="font-body-sm text-body-sm text-on-surface-variant leading-snug">
          Acepto las <a class="text-primary font-label-md underline underline-offset-2" href="#terminos">Condiciones de Uso</a> y la <a class="text-primary font-label-md underline underline-offset-2" href="#privacidad">Política de Privacidad Gastronómica</a>.
        </div>
</label>

<!-- Main Submit Action Button -->
<button class="w-full mt-space-sm py-space-md px-space-lg rounded-full bg-primary text-on-primary font-label-lg text-label-lg shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-space-sm hover:opacity-95" type="submit">
<span class="material-symbols-outlined text-[20px]">local_florist</span>
<span class="">Crear mi cuenta SeasonPal</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-space-lg flex items-center justify-center">

</div>

<div class="grid grid-cols-2 gap-space-sm">

<button aria-label="Registrarse con Apple" class="flex items-center justify-center gap-2 py-space-md px-space-sm bg-surface-container-low rounded-full shadow-sm hover:bg-surface-container transition-all active:scale-95" type="button">
<svg class="w-4 h-4 fill-on-surface shrink-0" viewBox="0 0 170 170">

</svg>
<span class="font-label-md text-label-md text-on-surface">Apple</span>
</button>
<!-- Google Auth -->
<button aria-label="Registrarse con Google" class="flex items-center justify-center gap-2 py-space-md px-space-sm bg-surface-container-low rounded-full shadow-sm hover:bg-surface-container transition-all active:scale-95" type="button">
<svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>

<div class="mt-space-lg text-center">

      ¿Ya eres miembro? 
      <a class="text-primary font-title-md text-title-md underline underline-offset-4 decoration-primary/40 hover:decoration-primary transition-colors ml-1" href="#login">
        Inicia sesión
      </a>
</p>
</div>
</div>
<script>
  (function() {
    // Password toggle interaction
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-password');
    const toggleIcon = document.getElementById('toggle-icon');

    if (toggleBtn && passwordInput && toggleIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    // Interactive Password Strength Meter
    const bar1 = document.getElementById('bar-1');
    const bar2 = document.getElementById('bar-2');
    const bar3 = document.getElementById('bar-3');
    const bar4 = document.getElementById('bar-4');
    const strengthText = document.getElementById('strength-text');
    const strengthLeaf = document.getElementById('strength-leaf');
    const passwordBadge = document.getElementById('password-badge');

    if (passwordInput && bar1 && bar2 && bar3 && bar4 && strengthText && strengthLeaf) {
      passwordInput.addEventListener('input', function(e) {
        const val = e.target.value;
        const len = val.length;

        // Reset states
        [bar1, bar2, bar3, bar4].forEach(bar => {
          bar.className = 'h-1.5 rounded-full bg-surface-container-highest transition-colors duration-300';
        });

        if (len === 0) {
          strengthText.textContent = 'Nivel de seguridad de la despensa';
          strengthText.className = 'font-body-sm text-body-sm text-outline transition-colors';
          strengthLeaf.className = 'material-symbols-outlined text-[14px] text-outline transition-colors';
          passwordBadge.textContent = 'Mínimo 8 caracteres';
          passwordBadge.className = 'font-label-sm text-label-sm text-outline font-normal';
          return;
        }

        if (len < 6) {
          bar1.classList.add('bg-secondary-container');
          strengthText.textContent = 'Brote tierno (débil)';
          strengthText.className = 'font-body-sm text-body-sm text-secondary transition-colors';
          strengthLeaf.className = 'material-symbols-outlined text-[14px] text-secondary transition-colors';
          passwordBadge.textContent = 'Demasiado corta';
          passwordBadge.className = 'font-label-sm text-label-sm text-secondary font-semibold';
        } else if (len < 8) {
          bar1.classList.add('bg-tertiary-fixed-dim');
          bar2.classList.add('bg-tertiary-fixed-dim');
          strengthText.textContent = 'Plántula en crecimiento';
          strengthText.className = 'font-body-sm text-body-sm text-tertiary transition-colors';
          strengthLeaf.className = 'material-symbols-outlined text-[14px] text-tertiary transition-colors';
          passwordBadge.textContent = 'Casi lista';
          passwordBadge.className = 'font-label-sm text-label-sm text-tertiary font-normal';
        } else if (len < 12) {
          bar1.classList.add('bg-primary-fixed-dim');
          bar2.classList.add('bg-primary-fixed-dim');
          bar3.classList.add('bg-primary');
          strengthText.textContent = 'Hierba silvestre segura';
          strengthText.className = 'font-body-sm text-body-sm text-primary transition-colors';
          strengthLeaf.className = 'material-symbols-outlined text-[14px] text-primary transition-colors';
          passwordBadge.textContent = 'Robusta';
          passwordBadge.className = 'font-label-sm text-label-sm text-primary font-semibold';
        } else {
          bar1.classList.add('bg-primary');
          bar2.classList.add('bg-primary');
          bar3.classList.add('bg-primary');
          bar4.classList.add('bg-primary');
          strengthText.textContent = 'Roble centenario (máxima seguridad)';
          strengthText.className = 'font-body-sm text-body-sm text-primary font-semibold transition-colors';
          strengthLeaf.className = 'material-symbols-outlined text-[14px] text-primary transition-colors';
          passwordBadge.textContent = 'Excelente';
          passwordBadge.className = 'font-label-sm text-label-sm text-primary font-bold';
        }
      });
    }

    // Cooking Level Card Selection
    const levelCards = document.querySelectorAll('.level-card');
    levelCards.forEach(card => {
      card.addEventListener('click', function() {
        levelCards.forEach(c => {
          c.className = 'level-card flex flex-col items-center justify-center p-space-sm rounded-xl bg-surface-container-low text-center transition-all min-h-[78px] shadow-sm active:scale-95';
          const icon = c.querySelector('.material-symbols-outlined');
          const title = c.querySelector('.font-semibold');
          const sub = c.querySelectorAll('span')[2];
          if (icon) {
            icon.className = 'material-symbols-outlined text-[22px] text-primary mb-1';
            icon.style.fontVariationSettings = "'FILL' 0";
          }
          if (title) title.className = 'font-label-sm text-label-sm text-on-surface font-semibold leading-tight';
          if (sub) sub.className = 'font-label-sm text-[10px] text-on-surface-variant';
        });

        this.className = 'level-card active-level flex flex-col items-center justify-center p-space-sm rounded-xl bg-primary text-center transition-all min-h-[78px] shadow-md active:scale-95';
        const activeIcon = this.querySelector('.material-symbols-outlined');
        const activeTitle = this.querySelector('.font-semibold');
        const activeSub = this.querySelectorAll('span')[2];
        if (activeIcon) {
          activeIcon.className = 'material-symbols-outlined text-[22px] text-on-primary mb-1';
          activeIcon.style.fontVariationSettings = "'FILL' 1";
        }
        if (activeTitle) activeTitle.className = 'font-label-sm text-label-sm text-on-primary font-semibold leading-tight';
        if (activeSub) activeSub.className = 'font-label-sm text-[10px] text-on-primary-container';
      });
    });
  })();
</script></main>
