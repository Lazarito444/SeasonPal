<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Delight micro-interaction: Subtle card scale/highlight on radio select
    const radioInputs = document.querySelectorAll('input[type="radio"]');
    
    function updateSelectionStates() {
      radioInputs.forEach(input => {
        const parentCard = input.closest('label');
        if (!parentCard) return;
        
        if (input.checked) {
          parentCard.classList.add('bg-surface-container-low', 'shadow-md');
          parentCard.classList.remove('bg-surface-container-lowest', 'shadow-sm');
        } else {
          parentCard.classList.remove('bg-surface-container-low', 'shadow-md');
          parentCard.classList.add('bg-surface-container-lowest', 'shadow-sm');
        }
      });
    }

    radioInputs.forEach(input => {
      input.addEventListener('change', updateSelectionStates);
    });

    // Initialize initial state based on pre-selected values
    updateSelectionStates();
  });
</script></main>
