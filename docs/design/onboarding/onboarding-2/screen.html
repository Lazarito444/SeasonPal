<script>
  (function initCuisineSelector() {
    const cards = document.querySelectorAll('.cuisine-card');
    const counterEl = document.getElementById('selected-counter');
    const feedbackEl = document.getElementById('target-feedback');
    const continueBtn = document.getElementById('continue-button');
    const statusDot = document.getElementById('status-dot');

    function updateState() {
      const selected = document.querySelectorAll('.cuisine-card[aria-pressed="true"]');
      const count = selected.length;

      counterEl.textContent = count === 1 ? '1 cocina seleccionada' : `${count} cocinas seleccionadas`;

      if (count >= 3) {
        continueBtn.disabled = false;
        continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        feedbackEl.textContent = '¡Todo listo!';
        feedbackEl.classList.remove('text-secondary');
        feedbackEl.classList.add('text-primary');
        statusDot.classList.remove('bg-secondary');
        statusDot.classList.add('bg-primary');
      } else {
        const remaining = 3 - count;
        continueBtn.disabled = true;
        continueBtn.classList.add('opacity-50', 'cursor-not-allowed');
        feedbackEl.textContent = `Selecciona ${remaining} m\u00E1s`;
        feedbackEl.classList.remove('text-primary');
        feedbackEl.classList.add('text-secondary');
        statusDot.classList.remove('bg-primary');
        statusDot.classList.add('bg-secondary');
      }
    }

    cards.forEach(card => {
      card.addEventListener('click', () => {
        const isSelected = card.getAttribute('aria-pressed') === 'true';
        const nextState = !isSelected;
        card.setAttribute('aria-pressed', nextState ? 'true' : 'false');

        const iconBubble = card.querySelector('.icon-bubble');
        const checkBox = card.querySelector('.check-box');
        const descText = card.querySelector('.tag-desc');

        if (nextState) {
          card.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'hover:bg-surface-container-low');
          card.classList.add('bg-primary', 'text-on-primary');

          iconBubble.classList.remove('bg-surface-container', 'text-primary');
          iconBubble.classList.add('bg-on-primary/15', 'text-on-primary');

          checkBox.classList.remove('bg-surface-container', 'text-transparent');
          checkBox.classList.add('bg-on-primary', 'text-primary');

          descText.classList.remove('text-on-surface-variant');
          descText.classList.add('opacity-80');
        } else {
          card.classList.remove('bg-primary', 'text-on-primary');
          card.classList.add('bg-surface-container-lowest', 'text-on-surface', 'hover:bg-surface-container-low');

          iconBubble.classList.remove('bg-on-primary/15', 'text-on-primary');
          iconBubble.classList.add('bg-surface-container', 'text-primary');

          checkBox.classList.remove('bg-on-primary', 'text-primary');
          checkBox.classList.add('bg-surface-container', 'text-transparent');

          descText.classList.remove('opacity-80');
          descText.classList.add('text-on-surface-variant');
        }

        updateState();
      });
    });

    updateState();
  })();
</script></main>
