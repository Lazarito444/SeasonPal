<script>
  function updateCounters() {
    const selectedConstraints = document.querySelectorAll('#dietary-constraints button[data-selected="true"]').length;
    const selectedInterests = document.querySelectorAll('#interests-container button[data-selected="true"]').length;
    const total = selectedConstraints + selectedInterests;
    const counterEl = document.getElementById('preference-counter-text');
    if (counterEl) {
      if (total === 0) {
        counterEl.textContent = '0 preferencias seleccionadas (todo incluido)';
      } else if (total === 1) {
        counterEl.textContent = '1 preferencia personalizada activa';
      } else {
        counterEl.textContent = `${total} preferencias personalizadas activas`;
      }
    }
  }

  function toggleConstraint(btn) {
    const isSelected = btn.getAttribute('data-selected') === 'true';
    const newState = !isSelected;
    btn.setAttribute('data-selected', newState.toString());

    const iconWrap = btn.querySelector('.icon-wrap');
    const checkBox = btn.querySelector('.check-box');
    const checkIcon = checkBox.querySelector('.material-symbols-outlined');

    if (newState) {
      btn.classList.remove('bg-surface-container-lowest');
      btn.classList.add('bg-primary', 'shadow-md');
      
      const title = btn.querySelector('.font-title-md');
      const subtitle = btn.querySelector('.font-body-sm');
      title.classList.remove('text-on-surface');
      title.classList.add('text-on-primary');
      subtitle.classList.remove('text-on-surface-variant');
      subtitle.classList.add('text-on-primary/80');

      iconWrap.classList.remove('bg-surface-container', 'text-on-surface-variant');
      iconWrap.classList.add('bg-on-primary/20', 'text-on-primary');

      checkBox.classList.remove('bg-surface-container');
      checkBox.classList.add('bg-on-primary');

      checkIcon.classList.remove('text-transparent');
      checkIcon.classList.add('text-primary');
    } else {
      btn.classList.remove('bg-primary', 'shadow-md');
      btn.classList.add('bg-surface-container-lowest');

      const title = btn.querySelector('.font-title-md');
      const subtitle = btn.querySelector('.font-body-sm');
      title.classList.add('text-on-surface');
      title.classList.remove('text-on-primary');
      subtitle.classList.add('text-on-surface-variant');
      subtitle.classList.remove('text-on-primary/80');

      iconWrap.classList.add('bg-surface-container', 'text-on-surface-variant');
      iconWrap.classList.remove('bg-on-primary/20', 'text-on-primary');

      checkBox.classList.add('bg-surface-container');
      checkBox.classList.remove('bg-on-primary');

      checkIcon.classList.add('text-transparent');
      checkIcon.classList.remove('text-primary');
    }

    updateCounters();
  }

  function toggleInterest(pill, tone) {
    const isSelected = pill.getAttribute('data-selected') === 'true';
    const newState = !isSelected;
    pill.setAttribute('data-selected', newState.toString());

    const icon = pill.querySelector('.material-symbols-outlined');
    const label = pill.querySelector('.font-label-lg');

    if (newState) {
      if (tone === 'terracotta') {
        pill.classList.remove('bg-surface-container-low', 'text-on-surface');
        pill.classList.add('bg-secondary', 'text-on-secondary', 'shadow-md');
        icon.classList.remove('text-tertiary');
        icon.classList.add('text-on-secondary');
      } else {
        pill.classList.remove('bg-surface-container-low', 'text-on-surface');
        pill.classList.add('bg-primary', 'text-on-primary', 'shadow-md');
        icon.classList.remove('text-primary');
        icon.classList.add('text-on-primary');
      }
    } else {
      if (tone === 'terracotta') {
        pill.classList.add('bg-surface-container-low', 'text-on-surface');
        pill.classList.remove('bg-secondary', 'text-on-secondary', 'shadow-md');
        icon.classList.add('text-tertiary');
        icon.classList.remove('text-on-secondary');
      } else {
        pill.classList.add('bg-surface-container-low', 'text-on-surface');
        pill.classList.remove('bg-primary', 'text-on-primary', 'shadow-md');
        icon.classList.add('text-primary');
        icon.classList.remove('text-on-primary');
      }
    }

    updateCounters();
  }

  function handleContinue() {
    const selectedConstraints = Array.from(document.querySelectorAll('#dietary-constraints button[data-selected="true"]'))
      .map(b => b.querySelector('.font-title-md').textContent.trim());
    const selectedInterests = Array.from(document.querySelectorAll('#interests-container button[data-selected="true"]'))
      .map(b => b.querySelector('.font-label-lg').textContent.trim());

    // Gentle micro-haptic simulation
    if (window.navigator && window.navigator.vibrate) {
      window.navigator.vibrate(35);
    }

    // Visual button bounce
    const btn = event.currentTarget;
    btn.classList.add('scale-95');
    setTimeout(() => {
      btn.classList.remove('scale-95');
      // Navigation dispatch or form step progression
      console.log('Saved Preferences:', { selectedConstraints, selectedInterests });
    }, 150);
  }

  // Initialize display
  document.addEventListener('DOMContentLoaded', updateCounters);
</script></main>
