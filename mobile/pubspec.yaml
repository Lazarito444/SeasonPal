name: seasonpal
description: "SeasonPal — a cooking companion for your personal recipe library, AI help, and the cooking community."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  slang: ^4.19.2
  slang_flutter: ^4.19.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
