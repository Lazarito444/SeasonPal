name: seasonpal
description: "SeasonPal — a cooking companion for your personal recipe library, AI help, and the cooking community."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  json_serializable: ^6.15.1

flutter:
  uses-material-design: true
