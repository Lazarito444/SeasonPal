name: seasonpal
description: "SeasonPal — a cooking companion for your personal recipe library, AI help, and the cooking community."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  slang: ^4.19.2
  slang_flutter: ^4.19.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    # Variable families from the design system (docs/design/DESIGN.md). Flutter
    # instances the wght axis per requested weight; Playfair ships a second
    # file for the editorial italic accents.
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 700
        # Editorial accents ("Welcome *back*.") use the real italic face; a
        # synthetic slant is visibly heavier at display sizes.
        - asset: assets/fonts/PlayfairDisplay-Italic-Variable.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/PlayfairDisplay-Italic-Variable.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/PlayfairDisplay-Italic-Variable.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/PlayfairDisplay-Italic-Variable.ttf
          weight: 700
          style: italic
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 700
